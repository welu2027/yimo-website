name: sync-potd

# Pulls the Problem of the Day archive from Google Drive into data/potd.json.
#
# Committing that file triggers the `cd` workflow, which regenerates and
# deploys the site, so the problems are baked into the build and visitors'
# browsers never call Drive.
#
# GitHub cron is UTC and does not follow daylight saving: 08:00 UTC is
# midnight PST in winter and 01:00 PDT in summer. Both crons below are listed
# so the job lands at local midnight year round - the run is a no-op when
# nothing changed, so the extra firing is harmless.
on:
  schedule:
    - cron: '0 8 * * *'   # 00:00 PST
    - cron: '0 7 * * *'   # 00:00 PDT
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync = write and commit; list = print a folder inventory only'
        type: choice
        default: sync
        options: [sync, list]

# Needed for the commit step to push back to the branch.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Sync problems from Drive
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_ACCESS_TOKEN }}
        run: node scripts/sync-potd.js ${{ inputs.mode == 'list' && '--list' || '' }}

      - name: Commit if changed
        if: inputs.mode != 'list'
        run: |
          if git diff --quiet -- data/potd.json; then
            echo "No POTD changes today."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/potd.json
          git commit -m "Update Problem of the Day archive from Drive"
          git push
